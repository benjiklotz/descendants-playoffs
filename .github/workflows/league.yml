name: Update league data

on:
  schedule:
    - cron: "23 */3 * * *"          # every 3 hours, all week
    - cron: "*/20 17-23 * * 0"      # Sunday game windows (UTC): every 20 minutes
    - cron: "*/20 0-6 * * 1,2,5"    # late Sunday / Monday / Thursday night games (UTC early hours)
  workflow_dispatch:                # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build league.json from ESPN
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          SWID: ${{ secrets.SWID }}
        run: python build_league.py
      - name: Commit if changed
        run: |
          if [ -z "$(git status --porcelain -- league.json)" ]; then
            echo "No change"; exit 0
          fi
          git config user.name "league-bot"
          git config user.email "actions@users.noreply.github.com"
          git add league.json
          git commit -m "Update league data $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
